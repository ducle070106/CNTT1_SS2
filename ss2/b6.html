<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Quản lý Mượn Sách</title>
</head>
<body>
    <h2>Thủ tục Mượn Sách Thư viện</h2>

    <script>
        let bookName = prompt("Nhập tên sách:");
        let borrowerName = prompt("Nhập tên người mượn:");
        let status = prompt("Tình trạng sách (có sẵn / đã mượn / không có sẵn):").toLowerCase();
        let hasCard = prompt("Bạn có thẻ thư viện không? (có / không):").toLowerCase() === "có";
        
        let borrowDays = parseInt(prompt("Nhập số ngày dự định mượn (nếu sách đã mượn, nhập số ngày hiện tại đã mượn):") || "0");
        console.log(`Thông tin: Sách ${bookName} | Người mượn: ${borrowerName}`);

        if (status === "có sẵn") {
            if (hasCard) {
                alert("Chúc mừng, bạn có thể mượn sách này");
            } else {
                alert("Bạn không thể mượn sách nếu không có thẻ thư viện");
            }
        } 
        else if (status === "đã mượn") {
            if (borrowDays < 30) {
                if (hasCard) {
                    alert("Sách đang được mượn, vui lòng đợi đến khi trả lại");
                } else {
                    alert("Bạn không thể mượn sách nếu không có thẻ thư viện");
                }
            } else {
                alert("Sách đã mượn quá hạn hoặc có thông tin cần kiểm tra lại.");
            }
        } 
        else if (status === "không có sẵn") {
            alert("Sách này hiện tại không có sẵn trong thư viện, bạn có thể đăng ký mượn sau");
        } 
        else {
            alert("Thông tin không hợp lệ, vui lòng nhập lại");
        }
    </script>
</body>
</html>
