<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sách - JavaScript</title>
</head>
<body>
    <h2>Chương trình Quản lý Sách</h2>
    <p>Kết quả kiểm tra sẽ hiển thị trong tab <b>Console</b> hoặc <b>Alert</b>.</p>

    <script>
        let bookName = prompt("Mời bạn nhập tên sách:");
        let author = prompt("Mời bạn nhập tên tác giả:");
        let publishYear = prompt("Mời bạn nhập năm xuất bản:");
        publishYear = parseInt(publishYear);
        let currentYear = new Date().getFullYear();
        console.log("--- Thông tin sách ---");
        console.log("Tên sách: " + bookName);
        console.log("Tác giả: " + author);

        if (publishYear === currentYear) {
            alert("Đây là sách mới!");
            console.log("Tình trạng: Đây là sách mới!");
        } 
        else if (currentYear - publishYear <= 5 && currentYear - publishYear > 0) {

            alert("Sách khá mới");
            console.log("Tình trạng: Sách khá mới");
        } 
        else {
            alert("Sách đã cũ");
            console.log("Tình trạng: Sách đã cũ");
        }
    </script>
</body>
</html>
